[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; tự giải mã địa chỉ crash (backtrace) thành tên hàm/dòng code, và gắn mốc giờ cho mỗi dòng log
monitor_filters = esp32_exception_decoder, time, default
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts = pre:load_env.py
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -UCORE_DEBUG_LEVEL bỏ định nghĩa mặc định của framework trước khi set lại,
    ; tránh warning "redefined". Mức log nội bộ ESP-IDF (0=im lặng..5=rất chi tiết)
    ; KHÔNG ảnh hưởng tới log Serial.printf mình tự viết (vốn luôn hiện sẵn) —
    ; chỉ bật >0 khi thật sự cần soi log framework, vì nó làm binary phình to
    ; và có thể vượt quá dung lượng partition app0 (xem board_build.partitions).
    -UCORE_DEBUG_LEVEL
    -DCORE_DEBUG_LEVEL=0
